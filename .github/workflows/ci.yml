name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: banquinha
          POSTGRES_PASSWORD: banquinha
          POSTGRES_DB: banquinha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # E2E tests create and seed a separate `banquinha_test` database on this server.
      DATABASE_URL: postgres://banquinha:banquinha@localhost:5432/banquinha
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: pnpm generate && git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated
      - run: pnpm check

  # Ships the API to Cloud Run after checks pass. Pushes to main go to production; pull
  # requests from this repository go to the shared staging service, which every Vercel
  # preview talks to (last push wins). Setup: docs/deploy.md.
  deploy-api:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Never cancel: a cancelled run could stop halfway through a migration.
    concurrency: deploy-api-${{ github.event_name == 'push' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: GitHub OIDC token -> GCP, no stored key
    env:
      REGION: southamerica-east1
      IMAGE: southamerica-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/banquinha/api:${{ github.sha }}
      DATABASE_URL: ${{ github.event_name == 'push' && secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL_DIRECT_STAGING }}
    steps:
      - name: Select target
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "SERVICE=banquinha-api" >> "$GITHUB_ENV"
            echo "SECRET_SUFFIX=" >> "$GITHUB_ENV"
            echo "ENV_VARS=APP_ENV=production,WEB_ORIGIN=${{ vars.WEB_ORIGIN }},R2_ACCOUNT_ID=39897974cb09c05474b5515d228f9bfd,R2_BUCKET=banquinha-images,R2_PUBLIC_URL=https://img.banquinha.app,POSTHOG_KEY=${{ vars.POSTHOG_KEY }},POSTHOG_HOST=${{ vars.POSTHOG_HOST }}" >> "$GITHUB_ENV"
          else
            # No PostHog in staging. WEB_ORIGIN only matters for CORS, and previews reach the
            # API same-origin through /api, so the default is fine.
            echo "SERVICE=banquinha-api-staging" >> "$GITHUB_ENV"
            echo "SECRET_SUFFIX=-staging" >> "$GITHUB_ENV"
            echo "ENV_VARS=APP_ENV=staging,R2_ACCOUNT_ID=39897974cb09c05474b5515d228f9bfd,R2_BUCKET=banquinha-images-staging,R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL_STAGING }}" >> "$GITHUB_ENV"
          fi
          # Platform admin: on once its three secrets exist for this environment (docs/deploy.md).
          if [ "${{ vars.ADMIN_ENABLED }}" = true ]; then
            echo "ADMIN_SECRETS=,ADMIN_USERNAME=admin-username$SECRET_SUFFIX:latest,ADMIN_PASSWORD_HASH=admin-password-hash$SECRET_SUFFIX:latest,ADMIN_TOTP_SECRET=admin-totp-secret$SECRET_SUFFIX:latest" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before the new revision goes live, so migrations must stay compatible with the running one.
      - name: Migrate database
        run: pnpm db:migrate
      # Keeps the example stores (landing showcase) in sync with example-stores.ts.
      - name: Seed example stores
        run: pnpm db:seed
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      # One instance at most: the order rate limit counter lives in memory (see ROADMAP P3-01).
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "banquinha-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --cpu-boost \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "DATABASE_URL=database-url$SECRET_SUFFIX:latest,INTERNAL_API_KEY=internal-api-key$SECRET_SUFFIX:latest,R2_ACCESS_KEY_ID=r2-access-key-id$SECRET_SUFFIX:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key$SECRET_SUFFIX:latest,RESEND_API_KEY=resend-api-key:latest$ADMIN_SECRETS"
